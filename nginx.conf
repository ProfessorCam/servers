server {
    listen 8083;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A tiny target for the Web Server lesson's request-method exercises. Static
    # files only accept GET and HEAD (anything else is 405); this location
    # answers every method with a description of what it received, so students
    # can see a POST, PUT or DELETE land somewhere.
    location = /echo {
        default_type text/plain;
        add_header Cache-Control 'no-store' always;
        add_header Allow 'GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS' always;
        return 200 "You sent:        $request_method $request_uri $server_protocol\nHost:            $host\nContent-Type:    $content_type\nContent-Length:  $content_length\nUser-Agent:      $http_user_agent\nFrom:            $remote_addr\nThis is a plain-text answer from the /echo location in nginx.conf.\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
